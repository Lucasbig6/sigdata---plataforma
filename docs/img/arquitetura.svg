<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">Arquitetura do SIGDATA</title>
  <desc id="d">O navegador fala com o Next.js, que repassa /api para o backend Hono. O backend usa Postgres, DuckDB, bancos externos e o provedor de IA.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:10}
      .core{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.5;rx:10}
      .ext{fill:#fef3c7;stroke:#d97706;stroke-width:1.5;rx:10}
      .t{fill:#0f172a}.s{fill:#475569;font-size:12px}
      .l{stroke:#475569;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect class="box" x="30" y="190" width="150" height="80"/><text class="t" x="105" y="225" text-anchor="middle" font-weight="600">Navegador</text><text class="s" x="105" y="246" text-anchor="middle">cookie de sessão</text>
  <rect class="core" x="250" y="190" width="170" height="80"/><text class="t" x="335" y="222" text-anchor="middle" font-weight="600">Frontend</text><text class="s" x="335" y="242" text-anchor="middle">Next.js 16 · :3000</text><text class="s" x="335" y="258" text-anchor="middle">repassa /api/*</text>
  <rect class="core" x="490" y="150" width="190" height="160"/><text class="t" x="585" y="182" text-anchor="middle" font-weight="600">Backend</text><text class="s" x="585" y="202" text-anchor="middle">Node + Hono · :4000</text>
  <text class="s" x="585" y="228" text-anchor="middle">Login (Better Auth)</text><text class="s" x="585" y="246" text-anchor="middle">Fontes e consultas</text><text class="s" x="585" y="264" text-anchor="middle">Chat com IA e ferramentas</text><text class="s" x="585" y="282" text-anchor="middle">Dashboards e compartilhamento</text>
  <rect class="box" x="740" y="40" width="130" height="64"/><text class="t" x="805" y="68" text-anchor="middle" font-weight="600">Postgres</text><text class="s" x="805" y="86" text-anchor="middle">contas, projetos…</text>
  <rect class="box" x="740" y="130" width="130" height="64"/><text class="t" x="805" y="158" text-anchor="middle" font-weight="600">DuckDB</text><text class="s" x="805" y="176" text-anchor="middle">CSV, XLSX, datasets</text>
  <rect class="ext" x="740" y="220" width="130" height="64"/><text class="t" x="805" y="248" text-anchor="middle" font-weight="600">Bancos externos</text><text class="s" x="805" y="266" text-anchor="middle">PG, MySQL, SQL Server</text>
  <rect class="ext" x="740" y="310" width="130" height="64"/><text class="t" x="805" y="338" text-anchor="middle" font-weight="600">API REST / Sheets</text><text class="s" x="805" y="356" text-anchor="middle">importadas p/ DuckDB</text>
  <rect class="ext" x="490" y="370" width="190" height="64"/><text class="t" x="585" y="398" text-anchor="middle" font-weight="600">Provedor de IA</text><text class="s" x="585" y="416" text-anchor="middle">Claude, Groq, OpenRouter…</text>
  <path class="l" d="M180 230H250" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="l" d="M420 230H490" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="l" d="M680 170L740 80" marker-end="url(#a)"/><path class="l" d="M680 190L740 162" marker-end="url(#a)"/><path class="l" d="M680 240L740 252" marker-end="url(#a)"/><path class="l" d="M680 285L740 335" marker-end="url(#a)"/>
  <path class="l" d="M585 310V370" marker-end="url(#a)"/>
  <text class="s" x="450" y="458" text-anchor="middle">Azul: código do SIGDATA · Amarelo: sistemas externos</text>
</svg>
