<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" font-family="system-ui, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">Fluxo geral do SIGDATA</title>
  <desc id="d">Dados entram como fonte, são preparados e publicados como dataset, viram perguntas e visualizações no chat, depois dashboards compartilhados.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>.b{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.5;rx:10}.t{fill:#0f172a;font-weight:600}.s{fill:#475569;font-size:12px}.l{stroke:#475569;stroke-width:1.5;fill:none}.n{fill:#0284c7;font-weight:700}</style>
  </defs>
  <g><rect class="b" x="10" y="60" width="160" height="110"/><text class="n" x="26" y="86">1</text><text class="t" x="90" y="104" text-anchor="middle">Fonte</text><text class="s" x="90" y="124" text-anchor="middle">enviar planilha ou</text><text class="s" x="90" y="140" text-anchor="middle">conectar banco/API</text></g>
  <g><rect class="b" x="205" y="60" width="160" height="110"/><text class="n" x="221" y="86">2</text><text class="t" x="285" y="104" text-anchor="middle">Preparar</text><text class="s" x="285" y="124" text-anchor="middle">editor SQL e etapas</text><text class="s" x="285" y="140" text-anchor="middle">publicar dataset</text></g>
  <g><rect class="b" x="400" y="60" width="160" height="110"/><text class="n" x="416" y="86">3</text><text class="t" x="480" y="104" text-anchor="middle">Perguntar</text><text class="s" x="480" y="124" text-anchor="middle">chat consulta os dados</text><text class="s" x="480" y="140" text-anchor="middle">e gera visualizações</text></g>
  <g><rect class="b" x="595" y="60" width="160" height="110"/><text class="n" x="611" y="86">4</text><text class="t" x="675" y="104" text-anchor="middle">Montar</text><text class="s" x="675" y="124" text-anchor="middle">dashboard com filtros,</text><text class="s" x="675" y="140" text-anchor="middle">páginas e layout</text></g>
  <g><rect class="b" x="790" y="60" width="160" height="110"/><text class="n" x="806" y="86">5</text><text class="t" x="870" y="104" text-anchor="middle">Compartilhar</text><text class="s" x="870" y="124" text-anchor="middle">link público ou</text><text class="s" x="870" y="140" text-anchor="middle">pessoas logadas</text></g>
  <path class="l" d="M170 115H205" marker-end="url(#a)"/><path class="l" d="M365 115H400" marker-end="url(#a)"/><path class="l" d="M560 115H595" marker-end="url(#a)"/><path class="l" d="M755 115H790" marker-end="url(#a)"/>
  <text class="s" x="480" y="215" text-anchor="middle">Usuários comuns começam no passo 3 com datasets já publicados por analistas.</text>
</svg>
